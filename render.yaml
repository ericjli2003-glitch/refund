services:
  - type: web
    name: refund
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REFUND_TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: refund-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: REFUND_SECRET
        sync: false
      - key: REFUND_PREVIOUS_SECRETS
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_orders,write_orders,read_products,read_locations,read_returns,write_returns,customer_read_customers,customer_read_orders,customer_write_customers,customer_write_orders,write_app_proxy
      - key: PUBLIC_SUPPORT_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REFUND_EMAIL_FROM
        sync: false

databases:
  - name: refund-db
    databaseName: refund
    user: refund
