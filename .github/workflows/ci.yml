name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: refund
          POSTGRES_PASSWORD: refund
          POSTGRES_DB: refund_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refund -d refund_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://refund:refund@localhost:5432/refund_ci?schema=public
      SHOPIFY_API_KEY: test_key
      SHOPIFY_API_SECRET: test_secret
      SHOPIFY_APP_URL: http://localhost:3000
      SCOPES: read_orders,write_orders,read_returns,write_returns
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npx prisma migrate deploy
      - run: node scripts/test-grant-cascade.mjs
      - run: npm test
      - run: npm run test:oauth
      - run: npx vite-node --config vite.test.config.ts tests/return-draft.integration.ts
      - run: npx vite-node --config vite.test.config.ts tests/merchant-onboarding.integration.ts
      - run: npx vite-node --config vite.test.config.ts tests/merchant-opportunity.integration.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node scripts/test-http.mjs
